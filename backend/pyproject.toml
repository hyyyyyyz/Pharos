[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xuanzang-backend"
version = "0.0.1"
description = "Xuanzang backend — layout-preserving research-paper translation and reading assistant"
readme = "../README.md"
requires-python = ">=3.13"
license = "AGPL-3.0-or-later"
authors = [{ name = "Xuanzang contributors" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "sse-starlette>=2.1",
    "pymupdf>=1.26.7",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "black>=24.10",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pre-commit>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["xuanzang"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["xuanzang", "engine_worker"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
warn_unused_ignores = true
ignore_missing_imports = true
