[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pharos-backend"
version = "2.0.0"
description = "Pharos backend — layout-preserving research-paper translation and reading assistant"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
authors = [{ name = "Pharos contributors" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "sse-starlette>=2.1",
    # Keep the range compatible with the engine (pdf2zh-next pins pymupdf<1.25.3);
    # the app only uses the stable page-count / metadata API.
    "pymupdf>=1.24,<1.25.3",
    "python-multipart>=0.0.12",
    # Auth. argon2id is the current password-hashing recommendation (memory-hard,
    # tuned defaults); PyJWT signs the stateless access tokens the browser and
    # future mobile clients both use.
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    # Zotero OAuth exchanges a short-lived request token for a long-lived API
    # key. Fernet gives that bearer secret authenticated encryption at rest;
    # the key material itself stays in PHAROS_CREDENTIAL_SECRET.
    "cryptography>=43.0",
    # Mature RFC 5849 normalization/signing for Zotero's OAuth 1.0a handshake.
    "oauthlib>=3.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "black>=24.10",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pre-commit>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["pharos"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["pharos", "engine_worker"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
