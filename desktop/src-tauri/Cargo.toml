[package]
name = "pharos-desktop"
version = "0.1.0"
description = "Pharos — a research reading & translation workbench"
authors = ["Pharos contributors"]
license = "AGPL-3.0-or-later"
edition = "2021"
# Tauri v2 needs a recent, stable Rust.
rust-version = "1.77.2"

# The library holds the actual app so the same entry point can serve desktop
# and (later) mobile; main.rs is a thin launcher over it.
[lib]
name = "pharos_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# The opener plugin sends external links (GitHub, DOI, arXiv) to the system
# browser instead of navigating away inside the app window.
tauri-plugin-opener = "2"
# Native Daily Vault directory selection and scoped filesystem access. The
# persisted-scope plugin restores only paths the user explicitly selected.
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-persisted-scope = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Release profile tuned for a small, fast binary — the whole point of Tauri.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
