[package]
name = "pharos-desktop"
version = "0.4.0"
description = "Pharos — an all-in-one, local-first research workbench"
authors = ["Pharos contributors"]
license = "AGPL-3.0-or-later"
edition = "2021"
# Tauri v2 needs a recent, stable Rust.
rust-version = "1.77.2"

# The library holds the actual app so the same entry point can serve desktop
# and (later) mobile; main.rs is a thin launcher over it.
[lib]
name = "pharos_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# The opener plugin sends external links (GitHub, DOI, arXiv) to the system
# browser instead of navigating away inside the app window.
tauri-plugin-opener = "2"
# Native Daily Vault directory selection and scoped filesystem access. The
# persisted-scope plugin restores only paths the user explicitly selected.
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-persisted-scope = "2"
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
# The desktop client talks to Zotero's loopback-only Local API. TLS is not
# needed for that fixed `127.0.0.1` endpoint, so keep reqwest's heavyweight TLS
# stack out of the native bundle.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"
regex = "1"
# Model credentials never enter the portable Workspace. This selects the
# native credential store on each desktop platform (Keychain / Credential
# Manager / Secret Service) while keeping one cross-platform API in Rust.
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
# Must be the first registered plugin. Its deep-link feature forwards a second
# protocol launch into the already-running Pharos window on Windows and Linux.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

# Release profile tuned for a small, fast binary — the whole point of Tauri.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
