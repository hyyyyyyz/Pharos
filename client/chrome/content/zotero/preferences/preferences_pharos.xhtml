<vbox id="zotero-prefpane-pharos" onload="event.waitUntil(Zotero_Preferences.Pharos.init())">
	<groupbox>
		<label><html:h2 data-l10n-id="pharos-prefs-account-header"/></label>

		<!-- Signed out: the sign-in form. -->
		<vbox id="pharos-signed-out">
			<html:div data-l10n-id="pharos-prefs-account-intro" class="pharos-prefs-intro"/>
			<html:div class="pharos-prefs-field">
				<html:label for="pharos-email" data-l10n-id="pharos-prefs-email"/>
				<html:input id="pharos-email" type="email" autocomplete="off"/>
			</html:div>
			<html:div class="pharos-prefs-field">
				<html:label for="pharos-password" data-l10n-id="pharos-prefs-password"/>
				<html:input id="pharos-password" type="password" autocomplete="off"/>
			</html:div>
			<hbox align="center">
				<button id="pharos-sign-in" data-l10n-id="pharos-prefs-sign-in"
					oncommand="Zotero_Preferences.Pharos.signIn()"/>
				<html:div id="pharos-message" class="pharos-prefs-message" role="alert"/>
			</hbox>
		</vbox>

		<!-- Signed in: who, and how to leave. -->
		<vbox id="pharos-signed-in" hidden="true">
			<html:div class="pharos-prefs-account">
				<html:span data-l10n-id="pharos-prefs-signed-in-as"/>
				<html:strong id="pharos-account-email"/>
			</html:div>
			<!-- The display name. The rail shows it in place of the address, so
			     this is the one thing about the account a user can change from
			     here. The email identifies it and cannot move. -->
			<hbox align="center">
				<html:label for="pharos-display-name"
					data-l10n-id="pharos-prefs-display-name"/>
				<html:input id="pharos-display-name" type="text"
					data-l10n-id="pharos-prefs-display-name-input"
					data-l10n-attrs="placeholder"/>
				<button id="pharos-display-name-save"
					data-l10n-id="pharos-prefs-display-name-save"
					oncommand="Zotero_Preferences.Pharos.saveDisplayName()"/>
			</hbox>
			<html:div id="pharos-display-name-note" class="pharos-prefs-help" hidden="hidden"/>

			<!-- The account's whole-PDF translation switch. Server-owned, not a
			     device preference, which is why it is here rather than in a
			     checkbox bound to a pref. The client already HONOURS it; without
			     this the account could only be changed from the web app. -->
			<hbox align="center">
				<html:label class="pharos-prefs-toggle">
					<html:input id="pharos-pdf-translation" type="checkbox"
						onchange="Zotero_Preferences.Pharos.savePdfTranslation()"/>
					<html:span data-l10n-id="pharos-prefs-pdf-translation"/>
				</html:label>
			</hbox>
			<html:div data-l10n-id="pharos-prefs-pdf-translation-help" class="pharos-prefs-help"/>
			<html:div id="pharos-pdf-translation-note" class="pharos-prefs-help" hidden="hidden"/>

			<hbox align="center">
				<button id="pharos-sign-out" data-l10n-id="pharos-prefs-sign-out"
					oncommand="Zotero_Preferences.Pharos.signOut()"/>
				<button id="pharos-sign-out-all" data-l10n-id="pharos-prefs-sign-out-all"
					oncommand="Zotero_Preferences.Pharos.signOutEverywhere()"/>
			</hbox>
			<html:div data-l10n-id="pharos-prefs-sign-out-all-help" class="pharos-prefs-help"/>
		</vbox>
	</groupbox>
</vbox>
