<?xml version="1.0"?>

<?xml-stylesheet href="chrome://global/skin/" type="text/css"?>
<?xml-stylesheet href="chrome://zotero-platform/content/zotero.css"?>
<?xml-stylesheet href="chrome://zotero/skin/pharosDailyView.css" type="text/css"?>

<!DOCTYPE window>

<!-- NOTE: a double hyphen anywhere inside an XML comment stops this whole
     document parsing and the window comes up blank with nothing logged. The
     "two hyphens in comments" convention in client/CLAUDE.md is for JS and
     SCSS; XML is the exception. -->

<window data-l10n-id="pharos-daily-window"
		xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
		xmlns:html="http://www.w3.org/1999/xhtml"
		id="pharos-daily-window"
		windowtype="pharos:daily"
		width="1040" height="700"
		onload="Zotero_Pharos_Daily.init()"
		onunload="Zotero_Pharos_Daily.destroy()">
	<!-- All three are required. data-l10n-id resolves against THIS document's
	     own resource list, so dropping pharos.ftl renders every id as nothing
	     and surfaces as a bare `undefined` rejection with no stack. -->
	<linkset>
		<html:link rel="localization" href="branding/brand.ftl" />
		<html:link rel="localization" href="zotero.ftl" />
		<html:link rel="localization" href="pharos.ftl" />
	</linkset>

	<script>
		Services.scriptloader.loadSubScript("chrome://zotero/content/include.js", this);
	</script>
	<script src="chrome://zotero/content/pharosDaily.js"/>

	<!-- Everything below the frame is built in pharosDaily.js. Only the three
	     panes, the toolbar and the two module-level lines are static, because
	     they are the parts that exist before any request has come back.

	     Every element here is HTML rather than XUL: a XUL button renders its
	     `label` attribute and ignores textContent, so a value-only Fluent
	     message on one produces a blank button. -->
	<vbox flex="1" id="pharos-daily-root">
		<html:div id="pharos-dv" class="pharos-dv">
			<html:div id="pharos-dv-rail" class="pharos-dv-rail">
				<html:div id="pharos-dv-rail-head" class="pharos-dv-rail-head"
					data-l10n-id="pharos-daily-rail-head"/>
				<html:div id="pharos-dv-dates"/>
			</html:div>

			<html:div id="pharos-dv-main" class="pharos-dv-main">
				<html:div id="pharos-dv-bar" class="pharos-dv-bar">
					<html:span id="pharos-dv-bar-date" class="pharos-dv-bar-date"/>
					<html:div id="pharos-dv-filters" class="pharos-dv-filters" hidden="hidden"/>
					<html:div id="pharos-dv-spacer" class="pharos-dv-spacer"/>
					<html:div id="pharos-dv-sort" class="pharos-dv-sort">
						<html:button id="pharos-dv-sort-score" class="pharos-dv-sbtn"
							data-l10n-id="pharos-daily-sort-score"/>
						<html:button id="pharos-dv-sort-time" class="pharos-dv-sbtn"
							data-l10n-id="pharos-daily-sort-time"/>
					</html:div>
					<html:span id="pharos-dv-count" class="pharos-dv-count"/>
					<!-- Which model wrote every summary and score on this screen.
					     It was only in two tooltips, and provenance nobody hovers
					     for is provenance nobody has. -->
					<html:span id="pharos-dv-model" class="pharos-dv-model"/>
					<!-- The data folder, beside the two controls whose data it
					     saves. The dot is a separate element rather than part
					     of the label so "connected" survives the label changing
					     to 保存中 and back. -->
					<html:button id="pharos-dv-vault" class="pharos-dv-vault">
						<html:span id="pharos-dv-vault-ic" class="pharos-dv-vault-ic"/>
						<html:span id="pharos-dv-vault-label"/>
						<html:span id="pharos-dv-vault-dot" class="pharos-dv-vault-dot"
							hidden="hidden"/>
					</html:button>
					<!-- The label lives in its own span so swapping the text
					     between 更新 and 更新中 cannot take the icon with it. -->
					<html:button id="pharos-daily-refresh" class="pharos-dv-refresh">
						<html:span id="pharos-dv-refresh-ic" class="pharos-dv-refresh-ic"/>
						<html:span id="pharos-dv-refresh-label"/>
					</html:button>
				</html:div>

				<html:div id="pharos-daily-status" class="pharos-dv-note" role="status"/>

				<html:div id="pharos-dv-banner" class="pharos-dv-banner" hidden="hidden">
					<html:span id="pharos-dv-banner-ic" class="pharos-dv-banner-ic"/>
					<html:span id="pharos-dv-banner-text" class="pharos-dv-banner-text"/>
				</html:div>

				<html:div id="pharos-dv-list" class="pharos-dv-list"/>
			</html:div>

			<html:div id="pharos-dv-detail" class="pharos-dv-detail"/>
		</html:div>

		<!-- The data folder sheet. Static shell, dynamic body: the two
		     paragraphs that state what a Vault does and does not back up are
		     fixed prose and belong here, where a translator can see them beside
		     each other; everything that depends on the connection is built in
		     pharosDaily.js.

		     position: fixed inside this browser resolves against the panel's own
		     viewport, so the layer covers the module and nothing else. -->
		<html:div id="pharos-dv-vault-layer" class="pharos-dv-vault-layer" hidden="hidden">
			<!-- tabindex is what lets openVault() move focus in here, which is
			     what puts Escape within reach of the keydown handler below. -->
			<html:div id="pharos-dv-vault-sheet" class="pharos-dv-vault-sheet" tabindex="-1"
				role="dialog" aria-modal="true" aria-labelledby="pharos-dv-vault-title">
				<html:div class="pharos-dv-vault-head">
					<html:div class="pharos-dv-vault-headings">
						<html:div class="pharos-dv-vault-eyebrow"
							data-l10n-id="pharos-daily-vault-eyebrow"/>
						<html:div id="pharos-dv-vault-title" class="pharos-dv-vault-h"
							data-l10n-id="pharos-daily-vault-title"/>
					</html:div>
					<html:button id="pharos-dv-vault-close" class="pharos-dv-vault-close"
						data-l10n-id="pharos-daily-vault-close"/>
				</html:div>

				<html:div class="pharos-dv-vault-summary">
					<html:span id="pharos-dv-vault-mark" class="pharos-dv-vault-mark"/>
					<html:div class="pharos-dv-vault-summary-text">
						<html:div id="pharos-dv-vault-path" class="pharos-dv-vault-path"/>
						<html:div id="pharos-dv-vault-msg" class="pharos-dv-vault-msg"/>
					</html:div>
				</html:div>

				<html:div id="pharos-dv-vault-warn" class="pharos-dv-vault-warn"
					hidden="hidden"/>
				<html:div id="pharos-dv-vault-error" class="pharos-dv-vault-error"
					hidden="hidden"/>
				<html:div id="pharos-dv-vault-actions" class="pharos-dv-vault-actions"/>

				<!-- The part that matters most. A reader who takes this for a
				     library backup and finds out otherwise after a disk failure
				     is the failure this whole panel is written against, so the
				     boundary is stated in the sheet itself and not in a tooltip. -->
				<html:div class="pharos-dv-vault-scope">
					<html:div class="pharos-dv-vault-scope-h"
						data-l10n-id="pharos-daily-vault-scope-head"/>
					<html:div class="pharos-dv-vault-scope-p"
						data-l10n-id="pharos-daily-vault-scope-in"/>
					<html:div class="pharos-dv-vault-scope-p"
						data-l10n-id="pharos-daily-vault-scope-out"/>
					<html:div class="pharos-dv-vault-scope-p"
						data-l10n-id="pharos-daily-vault-scope-when"/>
				</html:div>

				<html:button id="pharos-dv-vault-disconnect" class="pharos-dv-vault-disconnect"
					data-l10n-id="pharos-daily-vault-disconnect" hidden="hidden"/>
			</html:div>
		</html:div>
	</vbox>
</window>
