<!-- The Pharos lighthouse, as line art. The same paths the web client draws
     (frontend/src/design/icons.tsx, Icons.brand), so the two products show the
     same mark.

     Not z.svg: that is the application icon, a navy rounded square, and on the
     rail's navy background it is invisible. This follows context-stroke, so it
     takes the rail's own text colour. -->
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"
	stroke="context-stroke" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
	<path d="M8.7 18h6.6"/>
	<path d="M9.6 18l.7-6.2h3.4l.7 6.2"/>
	<path d="M10 8.2h4"/>
	<path d="M12 3.5l2.2 2.4H9.8z"/>
	<path d="M10.3 8.2v3.6"/>
	<path d="M13.7 8.2v3.6"/>
	<path d="M6.2 7.3 8.6 8"/>
	<path d="M17.8 7.3 15.4 8"/>
</svg>
