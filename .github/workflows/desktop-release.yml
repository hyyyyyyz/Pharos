name: Release

# Tag a commit `desktop-v0.5.0` and push it, or run this by hand from the
# Actions tab. The prefix is not decoration: this repository also holds the
# backend and the web client, and an unprefixed `v*` would claim the whole
# monorepo's version for one of its three products.
on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the leading v (e.g. 0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  # macOS is built on macOS because the disk image needs hdiutil, and because
  # the universal binary is assembled from the Mac Gecko runtime.
  macos:
    name: macOS (.dmg)
    runs-on: macos-14
    # Every `run` below is a client build. The workflow was written when this
    # lived in the client's own repository, where these paths were the root.
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
          else
            case "$GITHUB_REF_NAME" in
              desktop-v*) version="${GITHUB_REF_NAME#desktop-v}" ;;
              *) echo "Unexpected release ref: $GITHUB_REF_NAME" >&2; exit 1 ;;
            esac
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid desktop version: $version" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            client/reader/package-lock.json
            client/reader/pdfjs/pdf.js/package-lock.json

      - run: npm ci

      # Gecko is ~100MB per platform and does not change between releases,
      # so it is keyed on the hash files the build compares against.
      - name: Cache Gecko runtime
        uses: actions/cache@v4
        with:
          path: client/app/xulrunner
          key: xulrunner-mac-${{ hashFiles('client/app/config.sh') }}

      - name: Build
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          # A tag is a claim about the checked-in source, not permission to make
          # the runner silently manufacture a different version. Manual builds
          # remain flexible; release tags must match client/version exactly.
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            expected="${RELEASE_VERSION}.SOURCE"
            actual=$(tr -d '\r\n' < version)
            if [ "$actual" != "$expected" ]; then
              echo "Tag version $expected does not match committed client/version $actual" >&2
              exit 1
            fi
          fi
          # The .SOURCE suffix is required, not decorative: prepare_build
          # matches /([0-9].+)\.SOURCE/ to find the version at all, then
          # substitutes the suffix per channel -- "release" replaces it with
          # nothing. A bare "0.1.0" here fails with "Version number not found".
          echo "${RELEASE_VERSION}.SOURCE" > version
          npm run build
          grep -q 'pharos-reader-chat-button' build/resource/reader/reader.css
          grep -q 'pharos-reader-chat-label' build/resource/reader/reader.css
          build_dir=$(mktemp -d)
          app/scripts/prepare_build -s build -o "$build_dir" -c release
          # No -e: these builds are unsigned. See app/config.sh for what setting
          # DEVELOPER_ID and the NOTARIZATION_* values would change.
          app/build.sh -d "$build_dir" -p m -c release
          # The in-app updater installs the .app bundle itself; the dmg is the
          # manual path. Zip the staged app (config.sh puts it in app/staging)
          # so the update service can stream it.
          ditto -c -k --keepParent app/staging/Pharos.app \
            "app/dist/Pharos-${RELEASE_VERSION}-mac.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: pharos-macos
          path: |
            client/app/dist/*.dmg
            client/app/dist/*-mac.zip
          if-no-files-found: error

  # Windows and Linux are built on Linux and shipped as portable archives.
  #
  # The Windows NSIS installer needs WIN_NATIVE, i.e. Cygwin -- GitHub's Windows
  # runners are MSYS2, so build.sh takes its non-native path there anyway. Rather
  # than ship an installer this project cannot test, both platforms get the
  # archive build.sh already produces on this path.
  portable:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: w
            label: Windows (portable .zip)
            # `_win-x64`, not `_x64`. build.sh:1065 writes
            # "$APP_NAME-${VERSION}_$arch.zip" where $arch has already been through
            # get_canonical_arch, which turns `x64` into `win-x64` -- the platform
            # lives inside $arch rather than in a literal infix the way the Linux
            # name has one. This glob said `_x64` for five releases and matched
            # nothing every time: the job built a correct zip, the upload step found
            # no files, and the runner threw the workspace away. Green, and empty.
            glob: 'client/app/dist/*_win-x64.zip'
            artifact: pharos-windows
          - platform: l
            label: Linux (.tar.xz)
            glob: 'client/app/dist/*_linux-x86_64.tar.xz'
            artifact: pharos-linux
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
          else
            case "$GITHUB_REF_NAME" in
              desktop-v*) version="${GITHUB_REF_NAME#desktop-v}" ;;
              *) echo "Unexpected release ref: $GITHUB_REF_NAME" >&2; exit 1 ;;
            esac
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid desktop version: $version" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            client/reader/package-lock.json
            client/reader/pdfjs/pdf.js/package-lock.json

      - run: npm ci

      # The Windows runtime arrives as a Firefox .exe installer, and
      # fetch_xulrunner extracts it with 7z, which the Ubuntu runner does not
      # ship. macOS uses hdiutil and Linux uses tar, so both of those pass and
      # only this leg fails -- which is how the first run of this workflow
      # ended: two green jobs and one red one, at the same step name.
      - name: Install p7zip
        if: matrix.platform == 'w'
        run: sudo apt-get update && sudo apt-get install -y p7zip-full

      - name: Cache Gecko runtime
        uses: actions/cache@v4
        with:
          path: client/app/xulrunner
          key: xulrunner-${{ matrix.platform }}-x64-${{ hashFiles('client/app/config.sh') }}

      - name: Build
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          # Keep published artifacts tied to the source commit named by the tag.
          # workflow_dispatch is still allowed to exercise an arbitrary version.
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            expected="${RELEASE_VERSION}.SOURCE"
            actual=$(tr -d '\r\n' < version)
            if [ "$actual" != "$expected" ]; then
              echo "Tag version $expected does not match committed client/version $actual" >&2
              exit 1
            fi
          fi
          # The .SOURCE suffix is required, not decorative: prepare_build
          # matches /([0-9].+)\.SOURCE/ to find the version at all, then
          # substitutes the suffix per channel -- "release" replaces it with
          # nothing. A bare "0.1.0" here fails with "Version number not found".
          echo "${RELEASE_VERSION}.SOURCE" > version
          npm run build
          grep -q 'pharos-reader-chat-button' build/resource/reader/reader.css
          grep -q 'pharos-reader-chat-label' build/resource/reader/reader.css
          build_dir=$(mktemp -d)
          app/scripts/prepare_build -s build -o "$build_dir" -c release
          app/build.sh -d "$build_dir" -p ${{ matrix.platform }} -a x64 -c release

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.glob }}
          # The default is `warn`, which is how a glob that matched nothing shipped
          # five releases with no Windows build and never once turned a job red.
          # A build that produces no artifact has not succeeded.
          if-no-files-found: error

  release:
    name: Publish release
    needs: [macos, portable]
    runs-on: ubuntu-latest
    # Only publish a real tag after every platform has produced its artifact.
    # A manual run is for checking that the build works, and must not create a
    # release for a version that was never tagged. Keeping this gate strict is
    # important: an absent portable archive must never become a “latest” draft
    # that looks like a successful release to download-page automation.
    if: startsWith(github.ref, 'refs/tags/') && needs.macos.result == 'success' && needs.portable.result == 'success'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Verify all platform artifacts
        run: |
          set -euo pipefail
          test -d artifacts/pharos-macos
          test -d artifacts/pharos-windows
          test -d artifacts/pharos-linux
          find artifacts -maxdepth 2 -type f | sort

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          # A tag is the decision to release. Since the job gate and artifact
          # check above require every platform, publish it outright.
          draft: false
          body: |
            ## Pharos Desktop 1.3.1

            - Starting with 1.3.1, official Pharos builds connect to the hosted product at
              `https://pharos.selab.top`. The editable server-address field has
              been removed from Settings so an installed client has one clear
              account and service boundary.
            - Credentials remain bound to the service that issued them. Since
              older releases did not record a trustworthy token origin, 1.3.1
              discards every legacy Pharos token and cached account identity
              before that token can be attached to an official-service request.
              Sign in again once after upgrading.
            - The local Zotero library, PDF Reader, notes and annotations are not
              affected by this account migration and remain available offline.

            ## Install

            **macOS** — open the `.dmg` and drag Pharos to Applications. These
            builds carry no Apple Developer signature, so the first launch is
            refused. Double-click it anyway to get the refusal, then go to
            **System Settings → Privacy & Security**, scroll to Security, and
            press **Open Anyway** next to the message about Pharos. Confirm once
            more and it launches; later launches are normal.

            Control-click → Open, which older instructions give, no longer works:
            macOS 15 removed that bypass for code with no usable signature.

            **Windows** — unzip and run `zotero.exe`. This is a portable build,
            not an installer. The executable still carries Zotero's name: it is a
            prebuilt binary that ships in the tree, and renaming it is a build
            change that has not been made yet. The application itself is Pharos.

            **Linux** — extract the `.tar.xz` and run `zotero`. Same name, lesser
            reason: here it is only a launcher script, so this one really is just
            a rename nobody has done.

            ## Your library

            **Pharos opens the same Zotero library as Zotero itself.** On first
            launch it reads Zotero's official profile and adopts a custom
            `extensions.zotero.dataDir` only after validating an absolute path
            containing a regular `zotero.sqlite`. Older macOS profiles using a
            persistent descriptor are resolved through `lastDataDir`. Papers,
            collections, tags and annotations are the same objects in both.

            **Explicit paths still win.** If automatic discovery is unavailable,
            or you want to override it, give the first launch an absolute path:

            ```
            /Applications/Pharos.app/Contents/MacOS/zotero -datadir /path/to/your/Zotero
            ```

            **Run one at a time.** SQLite gives the library to a single
            application; Zotero, Pharos and Vibero can take turns, but not
            overlap.

            **Back up `~/Zotero` before the first run.** Pharos will not migrate
            the database — it refuses to *migrate* a library whose schema does not
            match, because upgrading it would leave Zotero unable to open its own
            data, and that cannot be undone. It may open the SQLite file to inspect
            its schema, but it applies no migration and performs no application
            writes when the schema is incompatible. The check is tested and the
            round trip was verified against a copy of a real library. It is still
            your only library, and this is still the first time another program has
            opened it.

            These builds are unsigned. Translation, AI chat and the daily digest
            need a Pharos account; the library, the reader and annotations are
            entirely local and need none.
