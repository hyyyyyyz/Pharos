# Builds the Pharos desktop app (Tauri) for macOS and Windows and attaches the
# installers to a single GitHub Release:
#   - macOS   : a universal .dmg (one download runs on Apple Silicon AND Intel)
#   - Windows : an .msi and an .exe (NSIS) setup
#
# Both platforms bundle the exact same React frontend, so the desktop apps are
# identical to the web app and to each other. (On Windows the WebView is
# WebView2 / Chromium; on macOS it is WebKit — both render this design the same.)
#
# Trigger by pushing a tag like `desktop-v0.3.0`, or run it by hand from the
# Actions tab. It publishes the installers after all platform builds succeed.
#
# The builds are UNSIGNED (no Apple / Windows code-signing certificate):
#   - macOS  : right-click Pharos.app -> Open, or `xattr -cr /Applications/Pharos.app`
#   - Windows: SmartScreen says "Windows protected your PC" -> More info -> Run anyway
# Proper signing/notarization removes both warnings and is a later step — see
# desktop/README.md.

name: Desktop release (macOS · Windows)

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (must match desktop app version)"
        required: true
        default: "desktop-v0.3.0"

permissions:
  contents: write

# A newer build supersedes an in-flight one for the same tag rather than racing
# it to upload assets to the same release.
concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            args: ""
            rust_targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Verify release tag matches app version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          APP_VERSION="$(node -p "require('./desktop/package.json').version")"
          EXPECTED_TAG="desktop-v${APP_VERSION}"
          if [ "$RELEASE_TAG" != "$EXPECTED_TAG" ]; then
            echo "Release tag $RELEASE_TAG does not match app version $APP_VERSION."
            exit 1
          fi

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./desktop/src-tauri -> target

      - name: Install frontend deps
        run: npm ci --prefix frontend

      - name: Install desktop deps (Tauri CLI)
        working-directory: desktop
        run: npm ci

      - name: Build & attach installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The release app is a real client of the deployed Pharos service.
          # This explicit value also overrides any runner-local Vite env file.
          VITE_API_BASE: https://pharos.selab.top/api
        with:
          projectPath: desktop
          args: ${{ matrix.args }}
          tagName: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          releaseName: "Pharos 桌面版 v__VERSION__"
          releaseBody: |
            Pharos 桌面版 —— 与网页版共享同一套界面，并增加完整的本机 Zotero
            只读文库：个人/群组文库、嵌套分类、保存检索、笔记、标注、全文索引和
            本地 PDF。首次连接会建立可离线使用的 SQLite 镜像，后续执行增量同步；
            不需要购买 Zotero 云存储。本地 PDF 不会自动上传，只有明确点击
            “导入 Pharos”才会复制到 Pharos。为保护原文库，当前版本不执行写回。

            **macOS**：下载 `.dmg`，拖入「应用程序」。首次打开若提示「已损坏 / 无法验证」，
            这是因为应用未做 Apple 签名（开源免费分发）——右键点 Pharos.app 选「打开」，
            或终端运行 `xattr -cr /Applications/Pharos.app`。Apple Silicon 与 Intel 通用。

            **Windows**：下载 `.msi` 或 `-setup.exe` 安装。首次运行 SmartScreen 若提示
            「Windows 已保护你的电脑」，点「更多信息」→「仍要运行」即可（同样是未签名所致）。
          releaseDraft: false
          prerelease: false
