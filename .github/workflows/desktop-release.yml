# Builds the macOS desktop app (Tauri) and attaches the .dmg to a GitHub
# Release. The .dmg is a universal binary — one download runs on both Apple
# Silicon and Intel Macs.
#
# Trigger by pushing a tag like `desktop-v0.1.0`, or run it by hand from the
# Actions tab. It creates a DRAFT release you review before publishing.
#
# The build is UNSIGNED (no Apple Developer account). macOS Gatekeeper will
# therefore refuse it on first open. To install a downloaded build:
#   right-click Pharos.app → Open  (once),  or:
#   xattr -cr /Applications/Pharos.app
# Proper code-signing + notarization (removes the warning entirely) needs an
# Apple Developer account and is a later step — see desktop/README.md.

name: Desktop release (macOS)

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Set up Rust (universal macOS targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./desktop/src-tauri -> target

      - name: Install frontend deps
        run: npm ci --prefix frontend || npm install --prefix frontend

      - name: Install desktop deps (Tauri CLI)
        working-directory: desktop
        run: npm install

      - name: Build & release the .dmg
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Which backend the bundled app talks to. Vite reads VITE_* from the
          # process env, so this reaches the build without a committed .env file
          # (frontend/.env.desktop is a local-dev convenience and is gitignored).
          # localhost is the honest default for now — the app connects to a
          # backend you run; change this once the backend is publicly deployed
          # (and add that origin to connect-src in tauri.conf.json).
          VITE_API_BASE: http://127.0.0.1:8848/api
        with:
          projectPath: desktop
          args: --target universal-apple-darwin
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'desktop-v__VERSION__' }}
          releaseName: "Pharos 桌面版 v__VERSION__"
          releaseBody: |
            Pharos 桌面版（macOS，通用二进制，Apple Silicon 与 Intel 通用）。

            下载下方的 `.dmg`，拖入「应用程序」。首次打开若提示「已损坏 / 无法验证」，
            这是因为应用未做 Apple 签名（开源免费分发）——右键点 Pharos.app 选「打开」，
            或在终端运行 `xattr -cr /Applications/Pharos.app` 即可。
          releaseDraft: true
          prerelease: false
