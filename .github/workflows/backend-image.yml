name: Build production image

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "deploy/**"
      - ".dockerignore"
      - ".github/workflows/backend-image.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve immutable tag
        id: version
        shell: bash
        run: echo "short_sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/hyyyyyyz/pharos:sha-${{ steps.version.outputs.short_sha }}
            ghcr.io/hyyyyyyz/pharos:main
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Pull and smoke-test the published image
        env:
          IMAGE: ghcr.io/hyyyyyyz/pharos:sha-${{ steps.version.outputs.short_sha }}
        shell: bash
        run: |
          docker pull "$IMAGE"
          docker run -d --rm \
            --name pharos-smoke \
            --read-only \
            --tmpfs /data:rw,uid=1000,gid=1000,mode=700 \
            --tmpfs /cache:rw,uid=1000,gid=1000,mode=700 \
            --tmpfs /tmp:rw,uid=1000,gid=1000,mode=1777 \
            -e PHAROS_AUTH_SECRET=smoke-test-secret-smoke-test-secret-1234 \
            -e PHAROS_DAILY_ENABLED=0 \
            -p 127.0.0.1:18400:8400 \
            "$IMAGE"
          trap 'docker logs --tail 100 pharos-smoke || true; docker stop pharos-smoke || true' EXIT
          healthy=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:18400/api/health \
              | python3 -c 'import json,sys; assert json.load(sys.stdin)["status"] == "ok"'; then
              healthy=1
              break
            fi
            sleep 2
          done
          test "$healthy" = 1
          docker exec pharos-smoke /opt/pharos-engine/bin/python -c 'import pdf2zh_next'

          curl --fail --silent --show-error http://127.0.0.1:18400/ > /tmp/pharos-index.html
          grep -q '<div id="root"></div>' /tmp/pharos-index.html
          grep -q '/favicon-round-v2-32.png' /tmp/pharos-index.html
          ! grep -q 'href="/favicon.ico"' /tmp/pharos-index.html
          asset=$(grep -oE '/assets/[^" ]+\.(js|css)' /tmp/pharos-index.html | head -n 1)
          test -n "$asset"
          curl --fail --silent --show-error -o /dev/null "http://127.0.0.1:18400$asset"
          curl --fail --silent --show-error -o /dev/null http://127.0.0.1:18400/favicon-round-v2.ico
          curl --fail --silent --show-error -o /dev/null http://127.0.0.1:18400/favicon-round-v2-32.png
          curl --fail --silent --show-error -o /dev/null http://127.0.0.1:18400/favicon-round-v2-16.png

          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18400/library)" = 200
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18400/missing.js)" = 404
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18400/api/not-found)" = 404
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18400/api/papers)" = 401
          # Capability sentinels: an owner-scoped route returns 401 when it is
          # mounted, while an old image with the route missing returns 404.
          # These pin the two APIs whose production deployment previously
          # lagged behind an otherwise healthy image.
          curl --fail --silent --show-error http://127.0.0.1:18400/api/auth/status \
            | python3 -c 'import json,sys; assert isinstance(json.load(sys.stdin)["allow_registration"], bool)'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18400/api/evidence)" = 401
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18400/docs)" = 200

          test "$(docker inspect pharos-smoke --format '{{.Config.User}}')" = "1000:1000"
          test "$(docker inspect pharos-smoke --format '{{.HostConfig.ReadonlyRootfs}}')" = "true"
