[App]
Vendor=Pharos
Name=Pharos
Version={{VERSION}}
BuildID={{BUILDID}}
Copyright=Copyright (c) 2026 Pharos Contributors; based on Zotero, Copyright (c) 2006-2025 Contributors
ID=pharos@pharos.selab.top

[Gecko]
MinVersion=140.0
MaxVersion=140.99.*

[XRE]
EnableExtensionManager=1
EnableProfileMigrator=1

; [AppUpdate] is intentionally disabled. Pointing it at Zotero's update server
; would let an official Zotero build be served as an "update" to Pharos, which
; would silently replace this application. Restore this section only once Pharos
; hosts its own update endpoint.
;
; [AppUpdate]
; URL=https://www.zotero.org/download/client/update/%VERSION%/%BUILD_ID%/%BUILD_TARGET%/%LOCALE%/%CHANNEL%/%OS_VERSION%/update.xml
