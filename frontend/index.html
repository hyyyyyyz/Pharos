<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets a standalone PWA (Android tablet) paint under
         the status bar; tablet.css hands the edge back via safe-area insets. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Pharos — 从文献发现、精读与知识沉淀到研究项目推进的一体化科研工作台" />

    <!-- Versioned transparent assets force browsers to discard the old opaque
         favicon cache instead of preserving the white square around the mark. -->
    <link rel="icon" href="/favicon-round-v2.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-round-v2-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-round-v2-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Paints the browser chrome to match the app's cream ground on mobile,
         and the deep navy in dark mode, so the page does not appear to float
         on an unrelated white bar. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F7F2E9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0B1524" />

    <title>Pharos — 一体化科研工作台</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
