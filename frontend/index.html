<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Pharos — 保留排版的科研论文翻译与阅读，附 AI 领航问答" />

    <!-- The circular P mark. `sizes="any"` lets a browser that understands the
         PNGs prefer them and skip the .ico entirely. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Paints the browser chrome to match the app's cream ground on mobile,
         and the deep navy in dark mode, so the page does not appear to float
         on an unrelated white bar. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F7F2E9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0B1524" />

    <title>Pharos</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
